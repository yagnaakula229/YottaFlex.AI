[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yottaflex-ai"
version = "0.1.0"
description = "Consent-aware abandoned cart recovery and attribution platform"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.15,<2.0",
    "fastapi>=0.115,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.8,<3.0",
    "python-dotenv>=1.0,<2.0",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: tests that do not require external services",
    "integration: tests requiring PostgreSQL connectivity",
]