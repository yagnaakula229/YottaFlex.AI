services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: yottaflex
      POSTGRES_USER: yottaflex
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yottaflex -d yottaflex"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: