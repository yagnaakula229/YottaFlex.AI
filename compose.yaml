services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${YOTTAFLEX_TEST_ADMIN_PASSWORD:?Set YOTTAFLEX_TEST_ADMIN_PASSWORD in the environment}
      YOTTAFLEX_TEST_DB_PASSWORD: ${YOTTAFLEX_TEST_DB_PASSWORD:?Set YOTTAFLEX_TEST_DB_PASSWORD in the environment}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - yottaflex_test_data:/var/lib/postgresql/data
      - ./scripts/init-test-db-user.sh:/docker-entrypoint-initdb.d/10-create-yottaflex-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yottaflex_ci -d yottaflex_test"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: yottaflex
      POSTGRES_USER: yottaflex
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yottaflex -d yottaflex"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  yottaflex_test_data:
  postgres_data: